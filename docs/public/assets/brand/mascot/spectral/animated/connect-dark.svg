<svg xmlns="http://www.w3.org/2000/svg" viewBox="-36 -24 166 152" width="166" height="152" role="img" class="pose-connect"><title>The Spectral ghost, fading in: connecting</title><style>.g-body{fill:#7df7d6;stroke:#7df7d6;stroke-width:8;stroke-linejoin:round;}.g-pix{fill:#7df7d6}.g-eye{fill:#121319}.g-cut{fill:none;stroke:#121319;stroke-width:4.5;stroke-linecap:round}.g-zz{fill:#4d5167}.g-dot{fill:#7df7d6}.gb-out{fill:#efeff3;stroke:#efeff3;stroke-width:6;stroke-linejoin:round}.gb-fill{fill:#121319}.g-no-out{fill:#ff7070;stroke:#ff7070;stroke-width:9;stroke-linejoin:round}.g-no-in{fill:#3b1d22}.g-no-x{fill:none;stroke:#ff7070;stroke-width:4.5;stroke-linecap:round}.t0{fill:#7df7d6}.t1{fill:#6fb1ff}.t2{fill:#9d86ff}.g-all{transform-box:fill-box;transform-origin:center}.g-bob{animation:g-bob 2.6s ease-in-out infinite alternate}.pose-sleep .g-bob{animation:none}.g-pix{animation:g-lag 1.3s ease-in-out infinite alternate}.g-eyes{transform-box:fill-box;transform-origin:center;animation:blink 4.6s infinite}.pose-connect .g-all{animation:g-fade 1.1s ease-in-out infinite alternate}.pose-lost .g-all{animation:g-flicker 1.9s steps(1) infinite}.pose-refused .g-all{animation:shake 1.6s ease-in-out infinite}.g-zz{transform-box:fill-box;animation:drift 2.4s ease-in-out infinite}.z2{animation-delay:.6s}.g-dot{animation:dots 1.1s infinite}.d2{animation-delay:.15s}.d3{animation-delay:.3s}.g-pop{transform-box:fill-box;transform-origin:center;animation:pop 1.8s ease-out infinite}.g-trail{animation:dots 1.1s infinite}.t1{animation-delay:.15s}.t2{animation-delay:.3s}@keyframes g-bob{from{transform:translateY(2px)}to{transform:translateY(-3px)}}@keyframes g-lag{from{transform:translate(0,0)}to{transform:translate(-2.5px,2.5px)}}@keyframes g-fade{from{opacity:.28}to{opacity:1}}@keyframes g-flicker{0%{opacity:1}18%{opacity:.5}26%{opacity:.9}55%{opacity:.45}62%{opacity:.8}80%{opacity:.4}88%{opacity:1}}@keyframes blink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}@keyframes dots{0%,80%,100%{opacity:.25}40%{opacity:1}}@keyframes drift{0%,100%{opacity:.4;transform:translateY(0)}50%{opacity:1;transform:translateY(-4px)}}@keyframes shake{0%,30%,100%{transform:translateX(0)}8%{transform:translateX(-3px)}16%{transform:translateX(3px)}}@keyframes pop{0%{opacity:0;transform:scale(.6)}15%,100%{opacity:1;transform:scale(1)}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><g class="g-bob"><g class="g-all"><rect class="g-pix" x="0" y="90" width="14" height="14" rx="1.5"/><path class="g-body" d="M14 46A36 36 0 0 1 86 46V98H72V82H57V98H43V82H26L14 70Z"/><g class="g-look"><g class="g-eyes"><ellipse class="g-eye" cx="38.5" cy="44" rx="5.5" ry="9"/><ellipse class="g-eye" cx="61.5" cy="44" rx="5.5" ry="9"/></g></g></g></g><circle class="g-dot" cx="34" cy="120" r="5"/><circle class="g-dot d2" cx="50" cy="120" r="5"/><circle class="g-dot d3" cx="66" cy="120" r="5"/></svg>
