<svg xmlns="http://www.w3.org/2000/svg" viewBox="-36 -24 166 152" width="166" height="152" role="img" class="pose-evaluate"><title>The Spectral ghost, at work: requests are arriving</title><style>.g-body{fill:#7df7d6;stroke:#1a1c26;stroke-width:8;stroke-linejoin:round;}.g-pix{fill:#1a1c26}.g-eye{fill:#1a1c26}.g-cut{fill:none;stroke:#1a1c26;stroke-width:4.5;stroke-linecap:round}.g-zz{fill:#9a9cab}.g-dot{fill:#0a7560}.gb-out{fill:#1a1c26;stroke:#1a1c26;stroke-width:6;stroke-linejoin:round}.gb-fill{fill:#f8f8f9}.g-no-out{fill:#c93434;stroke:#c93434;stroke-width:9;stroke-linejoin:round}.g-no-in{fill:#fbe6e6}.g-no-x{fill:none;stroke:#c93434;stroke-width:4.5;stroke-linecap:round}.t0{fill:#0a7560}.t1{fill:#3192ff}.t2{fill:#6644ff}.g-all{transform-box:fill-box;transform-origin:center}.g-bob{animation:g-bob 2.6s ease-in-out infinite alternate}.pose-sleep .g-bob{animation:none}.g-pix{animation:g-lag 1.3s ease-in-out infinite alternate}.g-eyes{transform-box:fill-box;transform-origin:center;animation:blink 4.6s infinite}.pose-connect .g-all{animation:g-fade 1.1s ease-in-out infinite alternate}.pose-lost .g-all{animation:g-flicker 1.9s steps(1) infinite}.pose-refused .g-all{animation:shake 1.6s ease-in-out infinite}.g-zz{transform-box:fill-box;animation:drift 2.4s ease-in-out infinite}.z2{animation-delay:.6s}.g-dot{animation:dots 1.1s infinite}.d2{animation-delay:.15s}.d3{animation-delay:.3s}.g-pop{transform-box:fill-box;transform-origin:center;animation:pop 1.8s ease-out infinite}.g-trail{animation:dots 1.1s infinite}.t1{animation-delay:.15s}.t2{animation-delay:.3s}@keyframes g-bob{from{transform:translateY(2px)}to{transform:translateY(-3px)}}@keyframes g-lag{from{transform:translate(0,0)}to{transform:translate(-2.5px,2.5px)}}@keyframes g-fade{from{opacity:.28}to{opacity:1}}@keyframes g-flicker{0%{opacity:1}18%{opacity:.5}26%{opacity:.9}55%{opacity:.45}62%{opacity:.8}80%{opacity:.4}88%{opacity:1}}@keyframes blink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}@keyframes dots{0%,80%,100%{opacity:.25}40%{opacity:1}}@keyframes drift{0%,100%{opacity:.4;transform:translateY(0)}50%{opacity:1;transform:translateY(-4px)}}@keyframes shake{0%,30%,100%{transform:translateX(0)}8%{transform:translateX(-3px)}16%{transform:translateX(3px)}}@keyframes pop{0%{opacity:0;transform:scale(.6)}15%,100%{opacity:1;transform:scale(1)}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><g class="g-bob"><g class="g-all"><rect class="g-pix" x="0" y="90" width="14" height="14" rx="1.5"/><path class="g-body" d="M14 46A36 36 0 0 1 86 46V98H72V82H57V98H43V82H26L14 70Z"/><g class="g-look"><g class="g-eyes"><ellipse class="g-eye" cx="38.5" cy="44" rx="5.5" ry="9"/><ellipse class="g-eye" cx="61.5" cy="44" rx="5.5" ry="9"/></g><path class="g-cut" d="M43 60q7 7 14 0"/></g></g></g><rect class="g-trail t0" x="-6" y="62" width="9" height="9" rx="1"/><rect class="g-trail t1" x="-20" y="50" width="7" height="7" rx="1"/><rect class="g-trail t2" x="-31" y="41" width="5" height="5" rx="1"/><g class="g-pop"><rect class="gb-out" x="88" y="-12" width="34" height="24" rx="11"/><rect class="gb-fill" x="88" y="-12" width="34" height="24" rx="11"/><circle class="g-dot" cx="97" cy="0" r="3"/><circle class="g-dot d2" cx="105" cy="0" r="3"/><circle class="g-dot d3" cx="113" cy="0" r="3"/></g></svg>
