<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" class="pose-listen"><title>chatomon listens to an incoming message</title><style>.m-ink{stroke:#efeff3}.m-acc{stroke:#f2a516}.m-acc-fill{fill:#f2a516}.m-eye{fill:#121319}.m-cut{stroke:#121319;fill:none}.m-ink-thin{stroke:#efeff3;opacity:.5}.m-b-stroke{fill:#efeff3;stroke:#efeff3}.m-b-fill{fill:#121319}.m-d-stroke{fill:#ff7070;stroke:#ff7070}.m-d-fill{fill:#3b1d22}.m-cut-danger{stroke:#ff7070}.m-body{fill:#efeff3}.eyes{transform-box:fill-box;transform-origin:center;animation:blink 4.6s infinite}.dot{animation:dots 1.1s infinite}.d2{animation-delay:.15s}.d3{animation-delay:.3s}.th{transform-box:fill-box;animation:rise 1.2s ease-in-out infinite}.t2{animation-delay:.2s}.t3{animation-delay:.4s}.nuc{transform-box:view-box;transform-origin:100px 146px}.pose-think .nuc{animation:breathe 1s ease-in-out infinite}.pose-reply .nuc{animation:squash 1.8s ease-out infinite}.pose-block .nuc,.pose-block-output .nuc{animation:shake 1.6s ease-in-out infinite}.run{animation:pulse .7s ease-in-out infinite}.zz{transform-box:fill-box;animation:drift 2.4s ease-in-out infinite}.z2{animation-delay:.6s}.pop{transform-box:fill-box;transform-origin:center;animation:pop 1.8s ease-out infinite}@keyframes blink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}@keyframes dots{0%,80%,100%{opacity:.25}40%{opacity:1}}@keyframes rise{0%,100%{opacity:.4;transform:translateY(0)}50%{opacity:1;transform:translateY(-3px)}}@keyframes breathe{50%{transform:scale(1.04,.96)}}@keyframes squash{0%,100%{transform:scale(1,1)}12%{transform:scale(1.12,.86)}24%{transform:scale(.96,1.05)}36%{transform:scale(1,1)}}@keyframes shake{0%,30%,100%{transform:translateX(0)}8%{transform:translateX(-3px)}16%{transform:translateX(3px)}}@keyframes pulse{50%{opacity:.35}}@keyframes drift{0%,100%{opacity:.4;transform:translateY(0)}50%{opacity:1;transform:translateY(-4px)}}@keyframes pop{0%{opacity:0;transform:scale(.6)}15%,100%