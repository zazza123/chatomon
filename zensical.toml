[project]
site_name = "chatomon"
site_description = "Declare a chat agent once and build it into native agent frameworks, wrapped by guardrail orbitals."
docs_dir = "docs/public"
nav = [
  { "Home" = "index.md" },
  { "Concepts" = "concepts.md" },
  { "Orbitals" = "orbitals.md" },
  { "Connectors" = "connectors.md" },
  { "Observability and audit" = "observability.md" },
  { "Deployment" = [
    { "Overview" = "deployment/index.md" },
    { "ScopeGuard on Cloud Run" = "deployment/cloud_run.md" },
  ] },
  { "API reference" = "reference/index.md" },
  { "Changelog" = "changelog.md" },
  { "Contributing" = "https://github.com/zazza123/chatomon/blob/main/CONTRIBUTING.md" },
]

[project.markdown_extensions.admonition]
[project.markdown_extensions.attr_list]
[project.markdown_extensions.md_in_html]
[project.markdown_extensions.toc]
permalink = true
[project.markdown_extensions.pymdownx.highlight]
[project.markdown_extensions.pymdownx.inlinehilite]
[project.markdown_extensions.pymdownx.superfences]
[[project.markdown_extensions.pymdownx.superfences.custom_fences]]
name = "mermaid"
class = "mermaid"
format = "pymdownx.superfences.fence_code_format"

[project.plugins.mkdocstrings.handlers.python]
paths = ["src"]
inventories = ["https://docs.python.org/3/objects.inv"]

[project.plugins.mkdocstrings.handlers.python.options]
docstring_style = "google"
docstring_options = { "ignore_init_summary" = true }
extensions = [{ "griffe_pydantic" = { "schema" = false } }]
filters = "public"
merge_init_into_class = true
separate_signature = true
show_root_heading = true
show_signature_annotations = true
show_submodules = true
signature_crossrefs = true
