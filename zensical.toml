[project]
site_name = "chatomon"
site_description = "Declare a chat agent once and build it into native agent frameworks, wrapped by guardrail orbitals."
site_url = "https://chatomon.andromedalabs.io/"
repo_url = "https://github.com/zazza123/chatomon"
repo_name = "zazza123/chatomon"
edit_uri = "edit/main/docs/public/"
docs_dir = "docs/public"
extra_css = ["stylesheets/chatomon.css"]
nav = [
  { "Home" = "index.md" },
  { "Guide" = [
    { "Concepts" = "concepts.md" },
    { "Observability and audit" = "observability.md" },
    { "Deployment" = [
      { "Overview" = "deployment/index.md" },
      { "ScopeGuard on Cloud Run" = "deployment/cloud_run.md" },
    ] },
  ] },
  { "Orbitals" = [
    { "Overview" = "orbitals/index.md" },
    { "Writing your own" = "orbitals/custom.md" },
    { "JudgeOrbital" = "orbitals/judge.md" },
    { "Limits" = "orbitals/limits.md" },
    { "Principled Intelligence" = "orbitals/principled.md" },
  ] },
  { "Connectors" = [
    { "Overview" = "connectors/index.md" },
    { "PydanticAI" = "connectors/pydantic_ai.md" },
    { "LangChain / LangGraph" = "connectors/langchain.md" },
    { "Microsoft Agent Framework" = "connectors/maf.md" },
    { "Google ADK" = "connectors/adk.md" },
  ] },
  { "Studio" = [
    { "Overview" = "studio/index.md" },
    { "Reading the screen" = "studio/screen.md" },
    { "Tuning orbitals" = "studio/tuning.md" },
    { "Back to code" = "studio/export.md" },
    { "Reloading the code" = "studio/reload.md" },
    { "Saving a turn as a test" = "studio/testing.md" },
    { "Frameworks" = "studio/frameworks.md" },
    { "Evaluating with Spectral" = "studio/spectral.md" },
  ] },
  { "API reference" = [
    { "Overview" = "reference/index.md" },
    { "Core" = [
      { "Atom" = "reference/atom.md" },
      { "Knowledge" = "reference/knowledge.md" },
      { "Schemas" = "reference/schemas.md" },
      { "Errors" = "reference/errors.md" },
    ] },
    { "Engine" = "reference/engine.md" },
    { "Orbitals" = [
      { "Base" = "reference/orbitals_base.md" },
      { "Judge" = "reference/orbitals_judge.md" },
      { "Limits" = "reference/orbitals_limits.md" },
      { "Principled" = "reference/orbitals_principled.md" },
    ] },
    { "Connectors" = [
      { "Base" = "reference/connectors_base.md" },
      { "PydanticAI" = "reference/connectors_pydantic_ai.md" },
      { "LangChain" = "reference/connectors_langchain.md" },
      { "Microsoft Agent Framework" = "reference/connectors_maf.md" },
      { "Google ADK" = "reference/connectors_adk.md" },
    ] },
    { "Observability" = "reference/observability.md" },
    { "Studio" = "reference/studio.md" },
  ] },
  { "Changelog" = "changelog.md" },
  { "Contributing" = "https://github.com/zazza123/chatomon/blob/main/CONTRIBUTING.md" },
]

[project.theme]
features = [
  "content.action.edit",
  "content.action.view",
  "content.code.copy",
  "content.tabs.link",
  "content.tooltips",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.path",
  "navigation.sections",
  "navigation.tabs",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "toc.follow",
]
# docs/overrides/partials/logo.html shows the dark variant of the logo in the slate scheme.
custom_dir = "docs/overrides"
logo = "assets/brand/symbol-light.svg"
favicon = "assets/brand/favicon.svg"

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

# Zensical drops its default extensions as soon as any is configured here,
# so every extension the docs use is listed explicitly.
[project.markdown_extensions.abbr]
[project.markdown_extensions.admonition]
[project.markdown_extensions.attr_list]
[project.markdown_extensions.def_list]
[project.markdown_extensions.footnotes]
[project.markdown_extensions.md_in_html]
[project.markdown_extensions.toc]
permalink = true
[project.markdown_extensions.pymdownx.details]
[project.markdown_extensions.pymdownx.emoji]
emoji_index = "zensical.extensions.emoji.twemoji"
emoji_generator = "zensical.extensions.emoji.to_svg"
[project.markdown_extensions.pymdownx.highlight]
[project.markdown_extensions.pymdownx.inlinehilite]
[project.markdown_extensions.pymdownx.keys]
[project.markdown_extensions.pymdownx.mark]
[project.markdown_extensions.pymdownx.snippets]
auto_append = ["docs/includes/abbreviations.md"]
check_paths = true
[project.markdown_extensions.pymdownx.superfences]
[[project.markdown_extensions.pymdownx.superfences.custom_fences]]
name = "mermaid"
class = "mermaid"
format = "pymdownx.superfences.fence_code_format"
[project.markdown_extensions.pymdownx.tabbed]
alternate_style = true

[project.plugins.mkdocstrings.handlers.python]
paths = ["src"]
inventories = ["https://docs.python.org/3/objects.inv"]

[project.plugins.mkdocstrings.handlers.python.options]
docstring_style = "google"
docstring_options = { "ignore_init_summary" = true }
extensions = [{ "griffe_pydantic" = { "schema" = false } }]
filters = "public"
group_by_category = true
heading_level = 1
members_order = "source"
merge_init_into_class = true
separate_signature = true
show_root_heading = true
show_signature_annotations = true
show_submodules = true
show_symbol_type_heading = true
show_symbol_type_toc = true
signature_crossrefs = true
summary = true
