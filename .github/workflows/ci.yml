name: CI

# The validation gate: lint, types, the test suite on every supported Python,
# the oldest dependency versions pyproject.toml allows, and the documentation
# build. Runs on every pull request to main, on every push to main, and from
# publish.yml on the commit being released.
#
# `ci-success` is the only check to mark as required: it fails when any job
# failed or was cancelled.
#
# Tool versions (ruff, pyright, …) come from uv.lock, so a new ruff release
# cannot turn this red without a deliberate lockfile change.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_call:

permissions: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - run: uv sync --locked
      - run: uv run ruff check
      - run: uv run ruff format --check

  types:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - run: uv sync --locked
      - run: uv run pyright

  test:
    name: test (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - run: uv run pytest

  lowest:
    name: test (oldest dependencies)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.11"
      # Resolves the oldest version pyproject.toml allows for every direct
      # dependency, so a floor that is too low fails here rather than at a
      # user's. No --locked: this resolves a different set on purpose; --no-sync
      # keeps `uv run` from syncing back to the lockfile.
      - run: uv sync --resolution lowest-direct
      - run: uv run --no-sync pytest

  docs:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - run: uv sync --locked
      - run: uv run zensical build --strict

  ci-success:
    if: always()
    needs: [lint, types, test, lowest, docs]
    runs-on: ubuntu-latest
    permissions: {}
    env:
      RESULTS: ${{ join(needs.*.result, ' ') }}
    steps:
      - name: Verify that no job failed
        run: |
          echo "Job results: $RESULTS"
          for result in $RESULTS; do
            if [ "$result" = "failure" ] || [ "$result" = "cancelled" ]; then
              echo "::error::A required CI job did not pass."
              exit 1
            fi
          done
          echo "All CI jobs passed."
