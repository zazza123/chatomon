name: CI

# The validation gate: lint, types, the test suite on every supported Python,
# the oldest dependency versions pyproject.toml allows, the documentation
# build, and the studio's browser smoke test. Runs on every pull request to
# main, on every push to main, and from publish.yml on the commit being
# released.
#
# `ci-success` is the only check to mark as required: it fails when any job
# failed or was cancelled.
#
# Every job has a time limit a few times its usual duration, here and in the
# other workflows: a step that hangs fails its job within minutes, where it
# would hold the pull request until GitHub's own limit of six hours.
#
# Tool versions (ruff, pyright, …) come from uv.lock, so a new ruff release
# cannot turn this red without a deliberate lockfile change.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_call:

permissions: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - run: uv sync --locked
      - run: uv run ruff check
      - run: uv run ruff format --check

  types:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - run: uv sync --locked
      - run: uv run pyright

  test:
    name: test (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - run: uv run pytest

  lowest:
    name: test (oldest dependencies)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.11"
      # Resolves the oldest version pyproject.toml allows for every direct
      # dependency, so a floor that is too low fails here rather than at a
      # user's. No --locked: this resolves a different set on purpose; --no-sync
      # keeps `uv run` from syncing back to the lockfile.
      - run: uv sync --resolution lowest-direct
      - run: uv run --no-sync pytest

  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - run: uv sync --locked
      - run: uv run zensical build --strict

  # The Playwright version in uv.lock, which picks the e2e job's image: Dependabot
  # moves the one, and the other follows with nothing to edit by hand.
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      version: ${{ steps.lock.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - id: lock
        run: |
          python3 - >> "$GITHUB_OUTPUT" <<'EOF'
          import tomllib

          with open("uv.lock", "rb") as file:
              packages = tomllib.load(file)["package"]
          print("version=" + next(p["version"] for p in packages if p["name"] == "playwright"))
          EOF

  # Runs in Playwright's own image, which holds the browsers of that version and
  # their system packages: installing them on the runner goes through apt and a
  # download, and on a slow mirror took most of the job's time limit.
  e2e:
    needs: playwright
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    container:
      image: mcr.microsoft.com/playwright/python:v${{ needs.playwright.outputs.version }}-noble
      # Chromium needs more shared memory than a container gets by default.
      options: --ipc=host
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - run: uv sync --locked
      - run: uv run pytest -m e2e
        env:
          CHATOMON_E2E: "1"

  ci-success:
    if: always()
    needs: [lint, types, test, lowest, docs, playwright, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    env:
      RESULTS: ${{ join(needs.*.result, ' ') }}
    steps:
      - name: Verify that no job failed
        run: |
          echo "Job results: $RESULTS"
          for result in $RESULTS; do
            if [ "$result" = "failure" ] || [ "$result" = "cancelled" ]; then
              echo "::error::A required CI job did not pass."
              exit 1
            fi
          done
          echo "All CI jobs passed."
