name: Publish

# Ships a release (CONTRIBUTING.md, "Versioning and releases"). Runs only when a
# GitHub Release is PUBLISHED: pushing a tag does nothing, so the notes are
# reviewed before anything ships. Verifies the tag, re-runs the full CI on the
# released commit, builds, publishes to PyPI with trusted publishing (no
# token), and deploys the documentation for final releases.
#
# One-off setup, before the first release:
#   - PyPI: a pending publisher for zazza123/chatomon, workflow publish.yml,
#     environment `pypi`.
#   - GitHub Pages: source "GitHub Actions".
#   - Custom domain chatomon.andromedalabs.io (site_url in zensical.toml). It is
#     set in the repository settings, not by a CNAME file: a Pages deployment
#     from Actions ignores one. Needs a public repository.
#       1. Account Settings → Pages: verify andromedalabs.io (TXT record
#          _github-pages-challenge-zazza123 on Cloudflare), so no other account
#          can claim a subdomain that points to GitHub Pages.
#       2. Cloudflare DNS: CNAME chatomon → zazza123.github.io, DNS only.
#       3. Repository Settings → Pages: custom domain chatomon.andromedalabs.io;
#          once the certificate is issued, enable "Enforce HTTPS".
#       4. Optional: proxy the record with SSL mode "Full (strict)" and enable
#          Cloudflare Web Analytics for the hostname (no code change).
#   - Environment `github-pages`: add the deployment tag rule `v*`. This job runs
#     on a release event, whose ref is the tag, and the environment usually
#     allows the default branch only — the deploy would be rejected after PyPI
#     has already shipped. (Recovery: fix the rule, re-run the `docs` job.)
#   - Environment `pypi`: restrict deployments to tags `v*`, so only a release
#     tag can reach the job that holds `id-token: write`.
on:
  release:
    types: [published]

permissions: {}

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      TAG: ${{ github.event.release.tag_name }}
      PRERELEASE: ${{ github.event.release.prerelease }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      # Format, and agreement with the pre-release flag: scripts/check_release_tag.py.
      - name: Check the tag
        run: python3 scripts/check_release_tag.py
      - name: Check that the tag is on main
        run: |
          set -euo pipefail
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag $TAG points to a commit that is not on main."
            exit 1
          fi
          echo "Tag $TAG is valid and on main."

  ci:
    needs: verify
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  build:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      TAG: ${{ github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - run: uv build
      - name: Check that the built version is the tag's
        run: |
          set -euo pipefail
          expected="${TAG#v}"
          actual="$(basename dist/*.whl | cut -d- -f2)"
          if [ "$actual" != "$expected" ]; then
            echo "::error::Built version $actual, but the tag says $expected."
            exit 1
          fi
          echo "Built chatomon $actual."
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  pypi:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/chatomon/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  docs:
    needs: pypi
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - run: uv sync --locked
      - run: uv run zensical build --strict
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v5
