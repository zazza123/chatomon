[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "chatomon"
dynamic = ["version"]
description = "Declare a chat agent once (instructions, knowledge and guardrail orbitals) and build it into native PydanticAI or LangChain agents."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Andrea Zanini" }]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.10",
    "opentelemetry-api>=1.28",
]

[project.optional-dependencies]
pydantic-ai = ["pydantic-ai-slim>=2,<3"]
langchain = ["langchain>=1.3,<2"]
principled = ["orbitals>=0.5,<0.6"]

[dependency-groups]
dev = [
    "pytest>=9",
    "pytest-asyncio>=1.4",
    "pytest-examples>=0.0.18",
    "opentelemetry-sdk>=1.28",
    "orbitals>=0.5,<0.6",
    "ruff>=0.16",
    "pyright>=1.1.400",
    "pydantic-ai-slim>=2,<3",
    "langchain>=1.3,<2",
]
docs = [
    "zensical==0.0.65",
    "mkdocstrings-python>=2.0.9",
    "griffe-pydantic>=1.3.1",
]

[tool.uv]
default-groups = ["dev", "docs"]

[tool.hatch.version]
path = "src/chatomon/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/chatomon"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra --strict-markers"
markers = [
    "integration: talks to real external services; skipped unless CHATOMON_INTEGRATION=1",
]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]
extend-exclude = ["docs/superpowers"]

[tool.ruff.lint]
preview = true
explicit-preview-rules = true
select = [
    "E", "F", "W", "I", "UP", "B", "SIM", "RUF", "D",
    "DOC201", "DOC202", "DOC402", "DOC403", "DOC501", "DOC502",
]
ignore = ["D105", "D107"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "DOC"]

[tool.pyright]
include = ["src", "tests", "scripts"]
pythonVersion = "3.10"
typeCheckingMode = "standard"
